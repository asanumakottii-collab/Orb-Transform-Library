<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a96a6"/>
    </marker>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#9fe3f0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9fe3f0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="520" fill="#06090f"/>
  <g transform="translate(0,50)">

  <!-- dome -->
  <path d="M 42.9 300 A 380 380 0 0 1 757.1 300" fill="none" stroke="#3f8a99" stroke-width="2"/>
  <text x="760" y="325" fill="#6fbccb" font-size="15" text-anchor="end">ドーム</text>
  <line x1="40" y1="430" x2="760" y2="430" stroke="#2a3340" stroke-width="1.5"/>

  <!-- dome radius -->
  <line x1="400" y1="430" x2="42.9" y2="300" stroke="#8a96a6" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="150" y="326" fill="#c9d3de" font-size="14" transform="rotate(20 150 326)" text-anchor="middle">dome-radius</text>

  <!-- second unit (faint) -->
  <line x1="400" y1="360" x2="290" y2="214" stroke="#2c4a55" stroke-width="1.2" stroke-dasharray="3 4"/>
  <line x1="327.2" y1="290.6" x2="384.8" y2="247.2" stroke="#4a5866" stroke-width="3"/>
  <ellipse cx="317" cy="262" rx="24" ry="5" fill="none" stroke="#4a5866" stroke-width="1.5" transform="rotate(-37 317 262)"/>

  <!-- optical axis of the unit -->
  <line x1="400" y1="360" x2="584" y2="97.5" stroke="#3a6f7c" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- ray: star -> lens centre -> plate -->
  <line x1="668.7" y1="161.3" x2="418.2" y2="287.2" stroke="#9fe3f0" stroke-width="1.8"/>

  <!-- plate -->
  <line x1="407.4" y1="279.7" x2="473.0" y2="325.7" stroke="#e8edf2" stroke-width="4" stroke-linecap="round"/>
  <!-- lens -->
  <ellipse cx="468.9" cy="261.7" rx="28" ry="6.5" fill="#0d1a22" stroke="#9fe3f0" stroke-width="1.6" transform="rotate(35 468.9 261.7)"/>

  <!-- points -->
  <circle cx="400" cy="430" r="4.5" fill="#e8edf2"/>
  <circle cx="400" cy="360" r="4.5" fill="#e8edf2"/>
  <circle cx="584" cy="97.5" r="4" fill="#3f8a99"/>
  <circle cx="668.7" cy="161.3" r="16" fill="url(#glow)"/>
  <circle cx="668.7" cy="161.3" r="3.5" fill="#ffffff"/>
  <circle cx="418.2" cy="287.2" r="3.5" fill="#ffffff"/>

  <!-- labels -->
  <text x="410" y="452" fill="#e8edf2" font-size="15">O ドームの中心</text>
  <text x="352" y="372" fill="#e8edf2" font-size="15" text-anchor="end">P 投影機の中心</text>
  <text x="684" y="150" fill="#ffffff" font-size="15">S 星</text>
  <text x="592" y="88" fill="#6fbccb" font-size="14">I 像の中心</text>
  <text x="488" y="246" fill="#9fe3f0" font-size="14">L レンズの中心</text>
  <text x="478" y="345" fill="#e8edf2" font-size="14">原板</text>
  <text x="404" y="270" fill="#ffffff" font-size="13" text-anchor="end">星の穴</text>

  <!-- dimensions -->
  <line x1="440" y1="430" x2="440" y2="360" stroke="#8a96a6" stroke-width="1.2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="448" y="400" fill="#c9d3de" font-size="13">projector-distance</text>
  <text x="428" y="353" fill="#c9d3de" font-size="10.5" text-anchor="middle" transform="rotate(-55 428 353)">plate-distance</text>

  </g>
  <!-- caption -->
  <text x="40" y="34" fill="#e8edf2" font-size="17" font-weight="bold">1つのユニットの光学系（北天側・模式図）</text>
  <text x="40" y="56" fill="#8a96a6" font-size="13">星 S からレンズの中心 L を通る直線が原板と交わる点に、星の穴をあける</text>
</svg>
